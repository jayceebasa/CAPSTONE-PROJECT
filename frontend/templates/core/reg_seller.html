{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Registration</title>
    <link rel="stylesheet" href="{% static 'assets/css/register.css' %}" />
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html {
        height: 100%;
      }
    
      body {
        min-height: 100vh;
        overflow-y: auto;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #1a1a1a, #333333) fixed;
        background-size: cover;
        background-repeat: no-repeat;
        margin: 0;
      }
    
      .bg-image {
        min-height: 100vh;
        padding: 3rem 0;
        background-attachment: fixed;
        background-position: center;
        background-size: cover;
      }

      #message-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
      }

      .card {
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px); /* For Safari */
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .form-control {
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        border-radius: 10px;
        padding: 12px;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        background-color: rgba(255, 255, 255, 0.15);
        border-color: #4caf50;
        box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.3);
        color: white;
      }

      .form-label {
        color: white;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .btn-success {
        background: linear-gradient(135deg, #4caf50, #2e7d32);
        border: none;
        border-radius: 10px;
        padding: 12px 30px;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 14px rgba(0, 0, 0, 0.2);
        background: linear-gradient(135deg, #5cbd61, #3e8e41);
      }

      .account-type-badge {
        position: absolute;
        top: -15px;
        right: 20px;
        background: linear-gradient(135deg, #ff9800, #f57c00);
        color: white;
        padding: 8px 15px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 1px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: white;
        -webkit-box-shadow: 0 0 0px 1000px rgba(255, 255, 255, 0.1) inset;
        transition: background-color 5000s ease-in-out 0s;
      }

      .input-group .btn {
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
      }

      .input-group .btn:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }

      h2 {
        color: white;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      a {
        transition: all 0.3s;
      }

      a:hover {
        color: #4caf50 !important;
        text-decoration: none !important;
      }

      @media (max-width: 768px) {
        .card {
          margin: 0 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container mt-3" id="message-container"></div>
    <section style="padding-top: 2rem;">
      <div class="mask d-flex align-items-center">
        <div class="container">
          <div class="row d-flex justify-content-center align-items-center">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6 mb-4">
              <div class="card position-relative">
                <span class="account-type-badge">SELLER ACCOUNT</span>
                <div class="card-body p-5">
                  <h2 class="text-uppercase text-center mb-5">Create an account</h2>

                  <form id="registerForm">
                    {% csrf_token %}
                    <input type="hidden" name="role" value="seller" />
                    <input type="hidden" name="email_verification_token" id="emailVerificationToken" />

                    <div class="form-outline mb-4">
                      <label class="form-label" for="username">Username</label>
                      <input type="text" id="username" name="username" class="form-control form-control-lg" required />
                    </div>

                    <div class="form-outline mb-4">
                      <label class="form-label" for="password">Password</label>
                      <div class="input-group">
                        <input
                          type="password"
                          id="password"
                          name="password"
                          class="form-control form-control-lg"
                          required
                          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
                          title="Must contain at least one number, one uppercase letter, one lowercase letter, one special character, and at least 8 or more characters" />
                        <button class="btn" type="button" id="togglePassword">
                          <i class="bi bi-eye"></i>
                        </button>
                      </div>
                      <small class="text-white-50">8+ characters with numbers, uppercase, lowercase, and special characters</small>
                    </div>

                    <div class="form-outline mb-4">
                      <label class="form-label" for="email">Email</label>
                      <input type="email" id="email" name="email" class="form-control form-control-lg" required />
                    </div>

                    <div class="row">
                      <div class="col-md-6 mb-4">
                        <label class="form-label" for="firstName">First Name</label>
                        <input type="text" id="firstName" name="first_name" class="form-control form-control-lg" required />
                      </div>

                      <div class="col-md-6 mb-4">
                        <label class="form-label" for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="last_name" class="form-control form-control-lg" required />
                      </div>
                    </div>

                    <div class="d-flex justify-content-center mt-4">
                      <button id="registerButton" type="submit" class="btn btn-success btn-lg px-5">Register</button>
                    </div>

                    <p class="text-center mt-5 mb-0" style="color: #e0e0e0">
                      Already have an account?
                      <a href="{% url 'core:login' %}" class="fw-bold text-white"><u>LOGIN HERE</u></a>
                    </p>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="{% static 'assets/js/register_seller.js' %}"></script>
  </body>
</html>
